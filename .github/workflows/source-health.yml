name: Source health

# Feeds rot without warning. Reuters, Reddit, and the NYT sports section all went dead while
# this app kept requesting them, and nobody noticed until someone ran the check by hand.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    name: Check every configured feed
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Provide secrets
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
        run: |
          if [ -n "$NYT_API_KEY" ]; then
            echo "NYT_API_KEY = $NYT_API_KEY" > Secrets.xcconfig
          else
            # Without a key the NYT source reports as not configured and is skipped rather
            # than counted as a failure.
            cp Secrets.xcconfig.example Secrets.xcconfig
          fi

      - name: Generate project
        run: xcodegen generate

      - name: Select a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r in sorted(d,reverse=True) for x in d[r] if 'iPhone' in x['name']))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run the health check
        id: health
        env:
          # xcodebuild does not pass the shell environment to the test process. Without this
          # prefix the check skips and the run reports success.
          TEST_RUNNER_RUN_SOURCE_HEALTH: "1"
          TEST_RUNNER_NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project VietNews.xcodeproj \
            -scheme VietNews \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:VietNewsTests/SourceHealthChecks \
            | tee health.log | tail -60

      - name: Open an issue when a source is down
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT=$(grep -E "^(vnexpress|bbc|eurogamer|nyt|substack) " health.log || echo "See the workflow log.")
          gh issue create \
            --title "Source health check failed on $(date -u +%Y-%m-%d)" \
            --label "ready-for-agent" \
            --body "$(printf 'A configured source returned nothing for every category it claims to support.\n\n```\n%s\n```\n\nWorkflow run: %s\n' "$REPORT" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
